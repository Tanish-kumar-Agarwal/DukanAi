# promtool unit tests for the backup alerts (roadmap 9.4): the stale-backup
# alert fires in a drill, on every CI run (job "Deployment (compose smoke)"):
#   promtool test rules deploy/prometheus/alerts.test.yml
# The test clock starts at 0: a series stuck at value 0 is a backup that has
# not succeeded since the epoch, a series growing with the clock is fresh.
rule_files:
  - alerts.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      # binlog: last success at t=0 and never again -> stale after 15 min
      - series: 'backup_last_success_timestamp_seconds{job="dukaanai-api", instance="api:3002", kind="binlog"}'
        values: '0x60'
      # dump: fresh every minute -> never stale
      - series: 'backup_last_success_timestamp_seconds{job="dukaanai-api", instance="api:3002", kind="dump"}'
        values: '0+60x60'
      # documents and offsite: recorded and fresh
      - series: 'backup_last_success_timestamp_seconds{job="dukaanai-api", instance="api:3002", kind="documents"}'
        values: '0+60x60'
      - series: 'backup_last_success_timestamp_seconds{job="dukaanai-api", instance="api:3002", kind="offsite"}'
        values: '0+60x60'
    alert_rule_test:
      - eval_time: 10m
        alertname: DukaanAiBackupStale
        exp_alerts: []
      - eval_time: 25m
        alertname: DukaanAiBackupStale
        exp_alerts:
          - exp_labels:
              severity: critical
              job: dukaanai-api
              instance: api:3002
              kind: binlog
            exp_annotations:
              summary: "Backup job binlog has not succeeded in time"
              description: "The last successful binlog backup was 25m 0s ago (limits: binlog 15 min, dump / documents / offsite 26 h). The recovery point is growing: run `db-ops status`, then the job by hand (db-ops backup, binlog-archive --flush, documents-backup, offsite push) and read its error."
      - eval_time: 45m
        alertname: DukaanAiBackupNeverRecorded
        exp_alerts: []

  - interval: 1m
    input_series:
      # only the dump has ever been recorded; the three other kinds are absent
      - series: 'backup_last_success_timestamp_seconds{job="dukaanai-api", instance="api:3002", kind="dump"}'
        values: '0+60x60'
    alert_rule_test:
      # absent() keeps the equality matchers as labels: one alert per missing kind.
      - eval_time: 45m
        alertname: DukaanAiBackupNeverRecorded
        exp_alerts:
          - exp_labels:
              severity: warning
              job: dukaanai-api
              kind: binlog
            exp_annotations:
              summary: "Backup job binlog has never recorded a success"
              description: "No backup_last_success_timestamp_seconds series for kind binlog. Either the job is not scheduled, or the API cannot read BACKUP_STATUS_DIR (the db-backups volume mounted read-only), or the job writes its stamp elsewhere."
          - exp_labels:
              severity: warning
              job: dukaanai-api
              kind: documents
            exp_annotations:
              summary: "Backup job documents has never recorded a success"
              description: "No backup_last_success_timestamp_seconds series for kind documents. Either the job is not scheduled, or the API cannot read BACKUP_STATUS_DIR (the db-backups volume mounted read-only), or the job writes its stamp elsewhere."
          - exp_labels:
              severity: warning
              job: dukaanai-api
              kind: offsite
            exp_annotations:
              summary: "Backup job offsite has never recorded a success"
              description: "No backup_last_success_timestamp_seconds series for kind offsite. Either the job is not scheduled, or the API cannot read BACKUP_STATUS_DIR (the db-backups volume mounted read-only), or the job writes its stamp elsewhere."

  - interval: 1m
    input_series:
      # dump: last success at t=0, sampled every minute for 27 hours -> stale after 26 h
      - series: 'backup_last_success_timestamp_seconds{job="dukaanai-api", instance="api:3002", kind="dump"}'
        values: '0x1620'
      - series: 'backup_last_success_timestamp_seconds{job="dukaanai-api", instance="api:3002", kind="binlog"}'
        values: '0+60x1620'
      - series: 'backup_last_success_timestamp_seconds{job="dukaanai-api", instance="api:3002", kind="documents"}'
        values: '0+60x1620'
      - series: 'backup_last_success_timestamp_seconds{job="dukaanai-api", instance="api:3002", kind="offsite"}'
        values: '0+60x1620'
    alert_rule_test:
      - eval_time: 25h
        alertname: DukaanAiBackupStale
        exp_alerts: []
      - eval_time: 27h
        alertname: DukaanAiBackupStale
        exp_alerts:
          - exp_labels:
              severity: critical
              job: dukaanai-api
              instance: api:3002
              kind: dump
            exp_annotations:
              summary: "Backup job dump has not succeeded in time"
              description: "The last successful dump backup was 1d 3h 0m 0s ago (limits: binlog 15 min, dump / documents / offsite 26 h). The recovery point is growing: run `db-ops status`, then the job by hand (db-ops backup, binlog-archive --flush, documents-backup, offsite push) and read its error."

  # Financial reconciliation (roadmap 9.5): drift fires at once, staleness
  # after 26 h without a run (plus the 30 min hold).
  - interval: 1m
    input_series:
      # every shop clean for ten minutes, then one shop's latest run is DRIFT
      - series: 'reconciliation_shops_with_drift{job="dukaanai-api", instance="api:3002"}'
        values: '0x10 1x10'
      # a run recorded at t=0 and never again, sampled every minute for 27 h
      - series: 'reconciliation_last_run_timestamp_seconds{job="dukaanai-api", instance="api:3002"}'
        values: '0x1620'
    alert_rule_test:
      - eval_time: 5m
        alertname: DukaanAiReconciliationDrift
        exp_alerts: []
      - eval_time: 15m
        alertname: DukaanAiReconciliationDrift
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "Financial reconciliation found drift"
              description: "1 shop(s) have a latest reconciliation run that ended in DRIFT or FAILED. Read it as the shop owner (GET /reconciliation/latest, or `npm run reconcile -- --shop <id> --date <day>` from a checkout): every drift names the check, the document or row and the two figures that disagree. The books are never corrected automatically."
      - eval_time: 25h
        alertname: DukaanAiReconciliationStale
        exp_alerts: []
      - eval_time: 27h
        alertname: DukaanAiReconciliationStale
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "No financial reconciliation run in 26 hours"
              description: "The most recent reconciliation run finished 1d 3h 0m 0s ago. Check CRON_ENABLED on at least one instance, CRON_RECONCILIATION, the cron:reconciliation lock and the 'Reconciliation' lines in the API logs; run one by hand with POST /reconciliation/run."

  # Uptime (roadmap 9.10): a probe that fails for two minutes pages; a
  # certificate inside 14 days of expiry warns after an hour.
  - interval: 1m
    input_series:
      - series: 'probe_success{job="blackbox-http", instance="http://api:3002/api/health/ready"}'
        values: '1x5 0x10'
      - series: 'probe_success{job="blackbox-login", instance="http://web:3000/login"}'
        values: '1x16'
      # expiry 10 days after the test epoch (the clock starts at 0)
      - series: 'probe_ssl_earliest_cert_expiry{job="blackbox-http", instance="https://api.example.com/api/health/ready"}'
        values: '864000x120'
    alert_rule_test:
      - eval_time: 6m
        alertname: DukaanAiEndpointDown
        exp_alerts: []
      - eval_time: 9m
        alertname: DukaanAiEndpointDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: blackbox-http
              instance: http://api:3002/api/health/ready
            exp_annotations:
              summary: "http://api:3002/api/health/ready has failed its probe for 2 minutes"
              description: "The readiness route or the login page does not answer as expected (blackbox-http). Check the edge, then GET /api/health/ready for the failing dependency."
      - eval_time: 30m
        alertname: DukaanAiCertificateExpiring
        exp_alerts: []
      - eval_time: 61m
        alertname: DukaanAiCertificateExpiring
        exp_alerts:
          - exp_labels:
              severity: warning
              job: blackbox-http
              instance: https://api.example.com/api/health/ready
            exp_annotations:
              summary: "The certificate of https://api.example.com/api/health/ready expires in under 14 days"
              description: "Automatic renewal has not happened (Caddy: ports 80/443 reachable, DNS; cert-manager: the Certificate resource). Renew before it lapses."
