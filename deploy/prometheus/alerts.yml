# Alert rules for the DukaanAI API (roadmap 7.6). Load them into Prometheus
# with `rule_files` (see prometheus.yml next to this file) and route the
# `severity` label in Alertmanager. Thresholds come from the recorded load
# baseline (docs/LOAD_TEST_BASELINE.md: checkout p95 < 500 ms, zero 5xx) and
# the outbox / retention settings; docs/OBSERVABILITY.md has the runbook for
# each alert. Validate after an edit: `promtool check rules deploy/prometheus/alerts.yml`.
groups:
  - name: dukaanai-api
    rules:
      # ---- availability -------------------------------------------------
      - alert: DukaanAiApiDown
        expr: up{job="dukaanai-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "API instance {{ $labels.instance }} is not scrapeable"
          description: "Prometheus could not scrape /api/metrics for 2 minutes. Check the readiness probe (/api/health/ready) and the container logs."

      # ---- 5xx rate -------------------------------------------------------
      # More than 1 % of answers are server errors, with enough traffic to
      # mean something (at least one request every 10 s on average).
      - alert: DukaanAiHigh5xxRate
        expr: |
          (
            sum(rate(http_requests_total{job="dukaanai-api", status=~"5.."}[5m]))
              /
            sum(rate(http_requests_total{job="dukaanai-api"}[5m]))
          ) > 0.01
          and
          sum(rate(http_requests_total{job="dukaanai-api"}[5m])) > 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "More than 1% of API answers are 5xx"
          description: "{{ $value | humanizePercentage }} of requests failed server-side over the last 5 minutes. Read the JSON logs for the correlation ids of the 500s and the error tracker for the stack traces."

      # Any unhandled error that reached error tracking: visible even when
      # traffic is too low for the ratio above.
      - alert: DukaanAiUnhandledErrors
        expr: increase(errors_tracked_total{job="dukaanai-api", kind=~"unhandled|prisma"}[15m]) > 5
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Unhandled API errors in the last 15 minutes"
          description: "{{ $value }} server-side errors were handed to error tracking (kind={{ $labels.kind }}). Each carries its correlation id as a tag."

      # ---- ledger -------------------------------------------------------
      # A ledger posting that threw means a sale, return, receipt or payment
      # transaction rolled back (or an unbalanced posting reached the ledger).
      - alert: DukaanAiLedgerPostingFailures
        expr: increase(ledger_posting_failures_total{job="dukaanai-api"}[10m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Ledger posting failed (source {{ $labels.source }})"
          description: "{{ $value }} ledger posting(s) threw in the last 10 minutes. Find the 'Unbalanced ledger posting' or database error in the JSON logs; the business transaction was rolled back, so the client saw an error."

      # ---- checkout latency ---------------------------------------------
      - alert: DukaanAiCheckoutSlow
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(checkout_duration_seconds_bucket{job="dukaanai-api", outcome="completed"}[10m]))) > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Checkout p95 above 500 ms"
          description: "The 95th percentile of completed checkouts is {{ $value | humanizeDuration }} over 10 minutes (baseline: under 500 ms at 3x peak). Check MySQL lock waits (one shop bills serially by design), the MySQL slow query log and Redis latency."

      # ---- outbox -------------------------------------------------------
      # The relays claim PENDING rows every few seconds; a row older than five
      # minutes that is still waiting means the relay crons are not running
      # (CRON_ENABLED, cron lock held by a dead pod) or the worker is stuck.
      - alert: DukaanAiOutboxLag
        expr: max(outbox_oldest_pending_age_seconds{job="dukaanai-api"}) > 300
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Outbox rows have been waiting for more than 5 minutes"
          description: "The oldest PENDING/CLAIMED outbox row is {{ $value | humanizeDuration }} old. Check that the relay crons run (one pod holds cron:outbox-reaper etc.), the system-events / purchase-events / webhook workers are connected (queue_jobs), and Redis."

      - alert: DukaanAiOutboxFailedRows
        expr: max(outbox_rows{job="dukaanai-api", status="FAILED"}) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Outbox rows exhausted their retries"
          description: "{{ $value }} outbox row(s) are FAILED. They carry their last error; list them with GET /sales/events?status=FAILED and re-queue with POST /sales/events/retry once the cause is fixed."

      # ---- backups (roadmap 9.4) ------------------------------------------
      # backup_last_success_timestamp_seconds{kind} is read by the API from
      # BACKUP_STATUS_DIR, where every backup job records its last success
      # (scripts/db/lib.sh record_success). Thresholds follow the objectives
      # in docs/DATA_SAFETY.md: the binary-log archive runs every 5 minutes
      # (15 min of slack), the dump, the documents archive and the off-site
      # copy run nightly (26 h). alerts.test.yml proves both rules fire.
      - alert: DukaanAiBackupStale
        expr: |
          (time() - backup_last_success_timestamp_seconds{job="dukaanai-api", kind="binlog"}) > 900
          or (time() - backup_last_success_timestamp_seconds{job="dukaanai-api", kind="dump"}) > 93600
          or (time() - backup_last_success_timestamp_seconds{job="dukaanai-api", kind="documents"}) > 93600
          or (time() - backup_last_success_timestamp_seconds{job="dukaanai-api", kind="offsite"}) > 93600
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Backup job {{ $labels.kind }} has not succeeded in time"
          description: "The last successful {{ $labels.kind }} backup was {{ $value | humanizeDuration }} ago (limits: binlog 15 min, dump / documents / offsite 26 h). The recovery point is growing: run `db-ops status`, then the job by hand (db-ops backup, binlog-archive --flush, documents-backup, offsite push) and read its error."

      - alert: DukaanAiBackupNeverRecorded
        expr: |
          absent(backup_last_success_timestamp_seconds{job="dukaanai-api", kind="dump"})
          or absent(backup_last_success_timestamp_seconds{job="dukaanai-api", kind="binlog"})
          or absent(backup_last_success_timestamp_seconds{job="dukaanai-api", kind="documents"})
          or absent(backup_last_success_timestamp_seconds{job="dukaanai-api", kind="offsite"})
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Backup job {{ $labels.kind }} has never recorded a success"
          description: "No backup_last_success_timestamp_seconds series for kind {{ $labels.kind }}. Either the job is not scheduled, or the API cannot read BACKUP_STATUS_DIR (the db-backups volume mounted read-only), or the job writes its stamp elsewhere."

      # ---- financial reconciliation (roadmap 9.5) --------------------------
      # reconciliation_shops_with_drift counts the shops whose latest run
      # (nightly cron or on demand) ended in DRIFT or FAILED, read from the
      # ReconciliationRun table on every scrape, so a restart or a scrape of
      # another instance shows the same figure. Nothing is corrected by the
      # job: a person reads the run and explains or fixes the books.
      - alert: DukaanAiReconciliationDrift
        expr: max(reconciliation_shops_with_drift{job="dukaanai-api"}) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Financial reconciliation found drift"
          description: "{{ $value }} shop(s) have a latest reconciliation run that ended in DRIFT or FAILED. Read it as the shop owner (GET /reconciliation/latest, or `npm run reconcile -- --shop <id> --date <day>` from a checkout): every drift names the check, the document or row and the two figures that disagree. The books are never corrected automatically."

      # The nightly job has not recorded a run anywhere for 26 hours: it is
      # not scheduled on any instance (CRON_ENABLED, CRON_RECONCILIATION), or
      # it fails before a run row is written.
      - alert: DukaanAiReconciliationStale
        expr: (time() - max(reconciliation_last_run_timestamp_seconds{job="dukaanai-api"})) > 93600
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "No financial reconciliation run in 26 hours"
          description: "The most recent reconciliation run finished {{ $value | humanizeDuration }} ago. Check CRON_ENABLED on at least one instance, CRON_RECONCILIATION, the cron:reconciliation lock and the 'Reconciliation' lines in the API logs; run one by hand with POST /reconciliation/run."

      # ---- queues -------------------------------------------------------
      - alert: DukaanAiQueueBacklog
        expr: max by (queue) (queue_jobs{job="dukaanai-api", state="waiting"}) > 1000
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "BullMQ queue {{ $labels.queue }} has a backlog"
          description: "{{ $value }} jobs are waiting on {{ $labels.queue }} for 15 minutes: the worker is not keeping up or not running. Check the worker's errors in the logs and add an API instance."

      - alert: DukaanAiQueueFailedJobs
        expr: max by (queue) (queue_jobs{job="dukaanai-api", state="failed"}) > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "BullMQ queue {{ $labels.queue }} holds failed jobs"
          description: "{{ $value }} job(s) on {{ $labels.queue }} failed every attempt. The job data and the last error are in Redis (the queue's failed set); a job that names an outbox row also marked that row FAILED."
